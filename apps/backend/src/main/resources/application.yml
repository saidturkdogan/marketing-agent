server:
  port: 8080

spring:
  application:
    name: plinth-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/plinth}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.plinth.security: DEBUG

app:
  clerk:
    jwks-url: ${CLERK_JWKS_URL:}
    issuer: ${CLERK_ISSUER:}
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbnMtYW5kLWl0LW5lZWRzLXRvLWJlLTI1Ni1iaXRzLWxvbmc}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  meta:
    graph-version: ${META_GRAPH_VERSION:v25.0}
    instagram:
      access-token: ${INSTAGRAM_ACCESS_TOKEN:}
      ig-user-id: ${INSTAGRAM_IG_USER_ID:}
  llm:
    google-api-key: ${GOOGLE_API_KEY:}
    google-model: ${GOOGLE_MODEL:gemini-2.5-flash}
  embedding:
    api-key: ${EMBEDDING_API_KEY:sk-mia_a68837_R-g4EagJ4ruwW9xKO48DlESDtxneIZHliroZ5LvrgBR_SzwU_loUj9eII9_syo6L}
    model: ${EMBEDDING_MODEL:qwen3-embedding-8b}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
  linkedin:
    access-token: ${LINKEDIN_ACCESS_TOKEN:}
  twitter:
    api-key: ${TWITTER_API_KEY:}
    api-secret: ${TWITTER_API_SECRET:}
    access-token: ${TWITTER_ACCESS_TOKEN:}
    access-secret: ${TWITTER_ACCESS_SECRET:}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
    frontend-redirect: ${GMAIL_FRONTEND_REDIRECT:http://localhost:5173/onboarding}
