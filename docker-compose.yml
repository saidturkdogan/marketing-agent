services:
  db:
    image: ankane/pgvector:latest
    container_name: plinth-db
    environment:
      POSTGRES_DB: plinth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plinth"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: plinth-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/plinth
      DATABASE_USER: postgres
      DATABASE_PASSWORD: secret
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://pleasant-earwig-57.clerk.accounts.dev/.well-known/jwks.json}
      CLERK_ISSUER: ${CLERK_ISSUER:-https://pleasant-earwig-57.clerk.accounts.dev}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_5910fCaeKkERofMXdKhd9anvd3VjOsTYPv4CZyypAH}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash}
      GOOGLE_IMAGE_MODEL: ${GOOGLE_IMAGE_MODEL:-gemini-2.5-flash-image}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-8b}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_IG_USER_ID: ${INSTAGRAM_IG_USER_ID:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8080/api/gmail/callback}
      GMAIL_FRONTEND_REDIRECT: ${GMAIL_FRONTEND_REDIRECT:-http://localhost:5173/onboarding}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:8080/api/calendar/callback}
      GOOGLE_CALENDAR_FRONTEND_REDIRECT: ${GOOGLE_CALENDAR_FRONTEND_REDIRECT:-http://localhost:5173/dashboard}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN:-}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      TWITTER_SCREEN_NAME: ${TWITTER_SCREEN_NAME:-Static Token}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL:-http://localhost:8080/api/twitter/callback}
      TWITTER_FRONTEND_REDIRECT: ${TWITTER_FRONTEND_REDIRECT:-http://localhost:5173/dashboard}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: plinth-frontend
    environment:
      VITE_BACKEND_URL: http://backend:8080
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_cGxlYXNhbnQtZWFyd2lnLTU3LmNsZXJrLmFjY291bnRzLmRldiQ}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
